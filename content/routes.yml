- id: cbba-torotoro
  from: cbba
  to: torotoro
  mode: bus
  hours: 4
  fr:
    t: 4 à 5 h
    how: >-
      Minibus quotidiens depuis le sud de Cochabamba (secteur Av. República), départ tôt le
      matin. Ou voiture/excursion.
    road: >-
      Ruta 7 vers le Valle Alto, puis Ruta 46 vers le sud par la montagne (route pavée ou
      asphaltée sur une grande partie).
    note: "Vérifier les horaires la veille : les départs ne sont pas toutes les heures."
  en:
    t: 4 to 5 h
    how: >-
      Daily minibuses from the south of Cochabamba (Av. República area), leaving early in
      the morning. Or by car or tour.
    road: >-
      Ruta 7 to the Valle Alto, then Ruta 46 south through the mountains (cobbled or paved
      for most of the way).
    note: "Check the times the day before: departures are not hourly."
  es:
    t: 4 a 5 h
    how: >-
      Minibuses diarios desde el sur de Cochabamba (zona Av. República), temprano en la
      mañana. O en auto o excursión.
    road: >-
      Ruta 7 hacia el Valle Alto, y luego Ruta 46 al sur por la montaña (empedrada o
      asfaltada en buena parte).
    note: "Confirma los horarios el día anterior: no salen cada hora."
