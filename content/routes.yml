# Every travel link once. mode: bus | train | avion | bateau | tour | velo. hours: typical duration.
# t: duration shown; how: how to travel; road and note are optional.
- id: cbba-lapaz
  from: cbba
  to: lapaz
  mode: bus
  hours: 7.5
  fr:
    t: 7 à 8 h
    how: >-
      Bus de jour ou de nuit depuis la Terminal de Cochabamba (nombreuses compagnies, toutes
      les heures). Bus « cama » conseillé de nuit.
    road: >-
      Ruta 4 : Cochabamba → Confital (col à ~4 200 m) → Caracollo, puis Ruta 1 (double voie)
      → Patacamaya → El Alto → La Paz.
    note: Très belle montée vers l'Altiplano. De jour pour profiter des paysages.
  en:
    t: 7 to 8 h
    how: >-
      Day or night buses from the Cochabamba bus terminal (many companies, every hour). A
      “cama” (sleeper) bus is best at night.
    road: >-
      Ruta 4: Cochabamba, Confital (pass at about 4,200 m), Caracollo, then Ruta 1 (dual
      carriageway) via Patacamaya and El Alto to La Paz.
    note: A beautiful climb up to the Altiplano. Travel by day to enjoy the views.
  es:
    t: 7 a 8 h
    how: >-
      Buses de día o de noche desde la Terminal de Cochabamba (muchas empresas, cada hora).
      De noche conviene un bus cama.
    road: >-
      Ruta 4: Cochabamba, Confital (paso a unos 4200 m), Caracollo, y luego Ruta 1 (doble
      vía) por Patacamaya y El Alto hasta La Paz.
    note: Una subida muy linda al Altiplano. De día para disfrutar el paisaje.
- id: cbba-lapaz-avion
  from: cbba
  to: lapaz
  mode: avion
  hours: 0.75
  fr:
    t: 45 min de vol
    how: Vols quotidiens BoA (plusieurs par jour), aéroport d'El Alto.
    note: "Arrivée directe à 4 000 m : moins bon pour l'acclimatation."
  en:
    t: 45 min flight
    how: Daily BoA flights (several a day) to El Alto airport.
    note: "You land straight at 4,000 m: worse for acclimatisation."
  es:
    t: 45 min de vuelo
    how: Vuelos diarios de BoA (varios al día) al aeropuerto de El Alto.
    note: "Se llega directo a 4000 m: peor para la aclimatación."
