tips.title: Good to know
tips.altitude: Altitude
tips.altitude.text: >-
  La Paz, Lake Titicaca, Potosí and Uyuni are above 3,500 m. Go up in stages, drink plenty
  and keep your first day there quiet. Coca tea helps.
tips.seasons: Seasons
tips.seasons.text: >-
  Dry season from May to October: blue skies and freezing nights at altitude. Rainy season
  from November to March: green landscapes, the mirror effect on the Salar, and some lowland
  roads cut off.
tips.money: Cash first
tips.money.text: >-
  You pay for almost everything in cash, in bolivianos (Bs). Foreign cards are rarely
  accepted, and the QR codes you'll see everywhere only work with a Bolivian bank account.
tips.transport: Buses
tips.transport.text: >-
  Minibuses have almost no stops: you wave one down and get off wherever you like. Most
  lines aren't on Google Maps, so ask the driver.
tips.more: All practical tips
