fr:
  name: Lomas de Arena
  label: Lomas de Arena
  short: Dunes de sable blanc et lagunes au sud de Santa Cruz.
  story: >-
    Juste au sud de Santa Cruz, des dunes de sable blanc surgissent au milieu de la
    végétation tropicale, avec des lagunes où l'on peut se baigner. On y fait du sandboard
    et on se croirait dans un petit désert en pleine forêt.
  todo:
    - Sandboard
    - Baignade dans les lagunes
  tips: Demi-journée en 4x4 depuis Santa Cruz.
en:
  name: Lomas de Arena
  label: Lomas de Arena
  short: White sand dunes and lagoons south of Santa Cruz.
  story: >-
    Just south of Santa Cruz, white sand dunes rise out of tropical vegetation, with lagoons
    you can swim in. You can go sandboarding and feel like you're in a little desert in the
    middle of the forest.
  todo:
    - Sandboarding
    - Swimming in the lagoons
  tips: Half a day by 4x4 from Santa Cruz.
es:
  name: Lomas de Arena
  label: Lomas de Arena
  short: Dunas de arena blanca y lagunas al sur de Santa Cruz.
  story: >-
    Justo al sur de Santa Cruz, dunas de arena blanca aparecen en medio de la vegetación
    tropical, con lagunas para bañarse. Se hace sandboard y uno se siente en un pequeño
    desierto en pleno bosque.
  todo:
    - Sandboard
    - Baño en las lagunas
  tips: Medio día en 4x4 desde Santa Cruz.
