fr:
  name: "Réserve de Sama : lagunes de Tajzara"
  label: Tajzara
  short: Lagunes d'altitude, dunes et flamants roses dans la réserve de Sama, au-dessus de Tarija.
  story: >-
    En montant de Tarija vers l'Altiplano, la route traverse la réserve de la cordillère de
    Sama jusqu'aux lagunes de Tajzara, à près de 3 700 m. Autour de la Laguna Grande, des
    dunes de sable et des herbes dorées, et sur l'eau les trois espèces de flamants des
    Andes. On peut y marcher sur d'anciens chemins préhispaniques.
  todo:
    - Laguna Grande de Tajzara et ses flamants
    - Dunes autour des lagunes
    - Village d'Iscayachi et son église en adobe
    - Chemin préhispanique de Sama
  tips: >-
    Journée en tour depuis Tarija, ou bus vers Villazón jusqu'à Iscayachi. Froid et vent en
    altitude.
en:
  name: "Sama reserve: Tajzara lagoons"
  label: Tajzara
  short: High lagoons, dunes and flamingos in the Sama reserve, above Tarija.
  story: >-
    Climbing from Tarija towards the Altiplano, the road crosses the Cordillera de Sama
    reserve up to the Tajzara lagoons, at almost 3,700 m. Around the Laguna Grande are sand
    dunes and golden grasses, and on the water all three species of Andean flamingo. You can
    walk on old pre-Hispanic trails.
  todo:
    - Laguna Grande de Tajzara and its flamingos
    - Dunes around the lagoons
    - Iscayachi village and its adobe church
    - Sama's pre-Hispanic trail
  tips: Day tour from Tarija, or the bus towards Villazón to Iscayachi. Cold and windy up high.
es:
  name: "Reserva de Sama: lagunas de Tajzara"
  label: Tajzara
  short: Lagunas de altura, dunas y flamencos en la reserva de Sama, sobre Tarija.
  story: >-
    Subiendo de Tarija hacia el Altiplano, el camino cruza la reserva de la Cordillera de
    Sama hasta las lagunas de Tajzara, a casi 3700 m. Alrededor de la Laguna Grande hay
    dunas de arena y pajonales dorados, y en el agua las tres especies de flamencos andinos.
    Se puede caminar por antiguos caminos prehispánicos.
  todo:
    - Laguna Grande de Tajzara y sus flamencos
    - Dunas alrededor de las lagunas
    - Pueblo de Iscayachi y su iglesia de adobe
    - Camino prehispánico de Sama
  tips: >-
    Tour de un día desde Tarija, o bus hacia Villazón hasta Iscayachi. Frío y viento en la
    altura.
