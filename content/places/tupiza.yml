fr:
  name: Tupiza
  label: Tupiza
  short: "Paysages de western : canyons rouges, cactus, et la dernière cavale de Butch Cassidy."
  story: >-
    Tupiza ressemble à un décor de western : canyons rouges, cactus géants et rivières
    asséchées. C'est d'ailleurs dans la région que Butch Cassidy et le Sundance Kid auraient
    fini leur cavale. On y fait de superbes balades à cheval, et on peut commencer ici le
    tour du Sud Lípez dans l'autre sens.
  todo:
    - Balade à cheval dans les canyons (Quebrada de Palala, Puerta del Diablo)
    - Cañón del Inca
    - Départ alternatif du tour du Sud Lípez (4 jours, finit à Uyuni)
  tips: Plus bas (2 950 m) et plus chaud qu'Uyuni.
en:
  name: Tupiza
  label: Tupiza
  short: "Wild West scenery: red canyons, cacti and the last ride of Butch Cassidy."
  story: >-
    Tupiza looks like a western film set: red canyons, giant cacti and dry riverbeds. It's
    in this region that Butch Cassidy and the Sundance Kid are said to have met their end.
    It's great for horse riding, and you can start the Sud Lípez tour from here in the other
    direction.
  todo:
    - Horse ride through the canyons (Quebrada de Palala, Puerta del Diablo)
    - Cañón del Inca
    - Alternative start of the Sud Lípez tour (4 days, ending in Uyuni)
  tips: Lower (2,950 m) and warmer than Uyuni.
es:
  name: Tupiza
  label: Tupiza
  short: "Paisajes de western: cañones rojos, cactus y la última huida de Butch Cassidy."
  story: >-
    Tupiza parece un decorado de western: cañones rojos, cactus gigantes y ríos secos. En
    esta región habrían terminado su huida Butch Cassidy y Sundance Kid. Es ideal para
    cabalgatas, y desde aquí se puede hacer el tour del Sud Lípez en sentido inverso.
  todo:
    - Cabalgata por los cañones (Quebrada de Palala, Puerta del Diablo)
    - Cañón del Inca
    - Salida alternativa del tour del Sud Lípez (4 días, termina en Uyuni)
  tips: Más bajo (2950 m) y más cálido que Uyuni.
