fr:
  name: "Missions : San Rafael de Velasco"
  label: San Rafael
  short: Église de mission aux décors de mica et de bois peint, entre San Ignacio et San José.
  story: >-
    San Rafael de Velasco possède l'une des plus anciennes églises de mission de Chiquitos.
    Son intérieur est décoré de bois peint et de mica, qui fait scintiller la chaire et les
    autels à la lumière. Le village, calme et très peu touristique, est une étape agréable
    sur la route entre San Ignacio et San José.
  todo:
    - Église et son intérieur décoré de mica
    - Village calme, loin des circuits
    - Étape entre San Ignacio et San José de Chiquitos
  tips: Sur la route San Ignacio – San José. Se visite en boucle avec Santa Ana et San Miguel.
en:
  name: "Missions: San Rafael de Velasco"
  label: San Rafael
  short: A mission church decorated with mica and painted wood, between San Ignacio and San José.
  story: >-
    San Rafael de Velasco has one of the oldest mission churches in Chiquitos. Its interior
    is decorated with painted wood and mica, which makes the pulpit and altars sparkle in
    the light. The quiet, little-visited village is a pleasant stop on the road between San
    Ignacio and San José.
  todo:
    - The church and its mica-decorated interior
    - A quiet village, off the usual route
    - A stop between San Ignacio and San José de Chiquitos
  tips: On the San Ignacio – San José road. Visit as a loop with Santa Ana and San Miguel.
es:
  name: "Misiones: San Rafael de Velasco"
  label: San Rafael
  short: Templo misional decorado con mica y madera pintada, entre San Ignacio y San José.
  story: >-
    San Rafael de Velasco tiene uno de los templos misionales más antiguos de Chiquitos. Su
    interior está decorado con madera pintada y mica, que hace brillar el púlpito y los
    altares con la luz. El pueblo, tranquilo y poco turístico, es una parada agradable en el
    camino entre San Ignacio y San José.
  todo:
    - El templo y su interior decorado con mica
    - Pueblo tranquilo, fuera de los circuitos
    - Parada entre San Ignacio y San José de Chiquitos
  tips: En el camino San Ignacio – San José. Se visita en circuito con Santa Ana y San Miguel.
