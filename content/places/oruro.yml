fr:
  name: Oruro
  label: Oruro
  short: >-
    Ville minière de l'Altiplano, célèbre pour son carnaval classé UNESCO. Point de départ
    du train vers Uyuni.
  story: >-
    Oruro est une ville minière de l'Altiplano, simple et travailleuse, connue pour l'un des
    plus grands carnavals d'Amérique du Sud, classé par l'UNESCO, avec ses diablades
    masquées. Le reste de l'année, on y monte en téléphérique jusqu'à la grande statue de la
    Vierge du Socavón, et c'est le point de départ du train vers Uyuni.
  todo:
    - Musée et mine du Socavón
    - Téléphérique jusqu'à la Vierge du Socavón
    - Carnaval (février ou mars)
  tips: Souvent juste une étape de transit (train ou bus vers Uyuni).
en:
  name: Oruro
  label: Oruro
  short: >-
    An Altiplano mining city, famous for its UNESCO-listed carnival. Starting point of the
    train to Uyuni.
  story: >-
    Oruro is a plain, hard-working mining city on the Altiplano, known for one of the
    biggest carnivals in South America, listed by UNESCO, with its masked devil dances. The
    rest of the year you can ride a cable car up to the giant statue of the Virgen del
    Socavón, and it's where the train to Uyuni leaves from.
  todo:
    - Socavón museum and mine
    - Cable car up to the Virgen del Socavón
    - Carnival (February or March)
  tips: Often just a transit stop (train or bus to Uyuni).
es:
  name: Oruro
  label: Oruro
  short: >-
    Ciudad minera del Altiplano, famosa por su Carnaval, Patrimonio de la UNESCO. Punto de
    partida del tren a Uyuni.
  story: >-
    Oruro es una ciudad minera del Altiplano, sencilla y trabajadora, conocida por uno de
    los carnavales más grandes de Sudamérica, reconocido por la UNESCO, con sus diabladas.
    El resto del año se puede subir en teleférico hasta la gran estatua de la Virgen del
    Socavón, y de aquí sale el tren a Uyuni.
  todo:
    - Museo y mina del Socavón
    - Teleférico hasta la Virgen del Socavón
    - Carnaval (febrero o marzo)
  tips: A menudo solo una parada de paso (tren o bus a Uyuni).
