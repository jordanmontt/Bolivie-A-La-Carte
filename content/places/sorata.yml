fr:
  name: Sorata
  label: Sorata
  short: Village tranquille au pied de l'Illampu, base de treks.
  story: >-
    Sorata est un village de montagne paisible, niché dans une vallée verdoyante au pied de
    l'Illampu (6 368 m). On y vient pour respirer, se promener, visiter une grotte avec un
    lac souterrain ou partir en trek vers la lagune Chillata. Un bon endroit pour souffler
    loin de l'agitation de La Paz.
  todo:
    - Grotte de San Pedro (lac souterrain)
    - Laguna Chillata (trek de 1-2 jours)
    - Base des grands treks de la Cordillère
  tips: Plus bas et plus doux que La Paz, idéal pour souffler.
en:
  name: Sorata
  label: Sorata
  short: A quiet village at the foot of Illampu, a base for treks.
  story: >-
    Sorata is a peaceful mountain village in a green valley at the foot of Illampu (6,368
    m). People come to breathe, stroll, visit a cave with an underground lake or trek up to
    the Chillata lagoon. A good place to unwind away from the bustle of La Paz.
  todo:
    - San Pedro cave (underground lake)
    - Laguna Chillata (1 to 2-day trek)
    - Base for the big treks of the Cordillera
  tips: Lower and milder than La Paz, ideal for a break.
es:
  name: Sorata
  label: Sorata
  short: Pueblo tranquilo al pie del Illampu, base de trekkings.
  story: >-
    Sorata es un pueblo de montaña apacible, en un valle verde al pie del Illampu (6368 m).
    Se viene a respirar, pasear, visitar una gruta con un lago subterráneo o hacer un
    trekking a la laguna Chillata. Un buen lugar para descansar del ajetreo de La Paz.
  todo:
    - Gruta de San Pedro (lago subterráneo)
    - Laguna Chillata (trekking de 1 a 2 días)
    - Base de los grandes trekkings de la Cordillera
  tips: Más bajo y templado que La Paz, ideal para descansar.
