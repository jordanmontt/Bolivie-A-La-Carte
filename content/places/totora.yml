fr:
  name: Totora
  label: Totora
  short: Petit village colonial très bien conservé sur l'ancienne route vers Santa Cruz.
  story: >-
    Totora est un village colonial resté figé dans le temps, avec ses balcons en bois et ses
    ruelles pavées. On le traverse si l'on prend l'ancienne route de Santa Cruz, et c'est
    une bonne pause sur ce long trajet de montagne.
  todo:
    - Rues pavées et balcons en bois
    - Étape sur la route de Samaipata
  tips: Bonne étape si vous prenez l'ancienne route Cochabamba → Samaipata.
en:
  name: Totora
  label: Totora
  short: A small, well-preserved colonial village on the old road to Santa Cruz.
  story: >-
    Totora is a colonial village frozen in time, with wooden balconies and cobbled lanes.
    You pass through it on the old road to Santa Cruz, and it makes a good break on that
    long mountain journey.
  todo:
    - Cobbled streets and wooden balconies
    - A stop on the way to Samaipata
  tips: A good stop if you take the old Cochabamba to Samaipata road.
es:
  name: Totora
  label: Totora
  short: Pueblito colonial muy bien conservado en la carretera antigua a Santa Cruz.
  story: >-
    Totora es un pueblo colonial detenido en el tiempo, con balcones de madera y callecitas
    empedradas. Se pasa por ahí en la carretera antigua a Santa Cruz y es una buena pausa en
    ese largo viaje de montaña.
  todo:
    - Calles empedradas y balcones de madera
    - Parada en el camino a Samaipata
  tips: Buena parada si tomas la carretera antigua Cochabamba – Samaipata.
