fr:
  name: Pairumani et Villa Albina
  label: Villa Albina
  short: La villa du roi de l'étain Simón Patiño, ses jardins, et le départ d'un sentier vers le Tunari.
  story: >-
    Au pied de la cordillère du Tunari, à Pairumani, Simón I. Patiño, l'homme de l'étain
    devenu l'un des plus riches du monde, fit construire dans les années 1920-1930 une
    villa à l'européenne pour sa femme Albina. On visite ses salons meublés, ses grands
    jardins aux arbres rares et le mausolée où reposent le couple. Juste au-dessus, le parc
    de Pairumani est le point de départ d'une montée exigeante vers le Tunari par sa face
    sud.
  todo:
    - Visite guidée de Villa Albina et de ses jardins
    - Le mausolée de Simón et Albina Patiño
    - Randonnée depuis le parc de Pairumani vers les hauteurs du Tunari
  tips: >-
    Visites en petits groupes, le matin du mardi au samedi : réserver par téléphone avant
    de venir. Trufi depuis la place de Quillacollo, ou taxi depuis Cochabamba (environ 40
    min). Le Palacio Portales, en ville, complète bien la visite.
en:
  name: Pairumani and Villa Albina
  label: Villa Albina
  short: The villa of tin baron Simón Patiño, its gardens, and the start of a trail to the Tunari.
  story: >-
    At the foot of the Tunari range, in Pairumani, Simón I. Patiño, the tin baron who
    became one of the richest men in the world, built a European-style villa in the
    1920s and 1930s for his wife Albina. You can visit its furnished rooms, the large
    gardens with rare trees and the mausoleum where the couple rest. Just above, the
    Pairumani park is the start of a demanding climb to the Tunari by its south face.
  todo:
    - Guided tour of Villa Albina and its gardens
    - The mausoleum of Simón and Albina Patiño
    - Hike from the Pairumani park up towards the Tunari heights
  tips: >-
    Tours in small groups, in the morning from Tuesday to Saturday: book by phone before
    coming. Trufi from the Quillacollo main square, or taxi from Cochabamba (about 40 min).
    The Palacio Portales in the city goes well with this visit.
es:
  name: Pairumani y Villa Albina
  label: Villa Albina
  short: La villa del barón del estaño Simón Patiño, sus jardines, y el inicio de un sendero al Tunari.
  story: >-
    Al pie de la cordillera del Tunari, en Pairumani, Simón I. Patiño, el rey del estaño y
    uno de los hombres más ricos del mundo, hizo construir en los años 1920 y 1930 una
    villa de estilo europeo para su esposa Albina. Se visitan sus salones amoblados, los
    grandes jardines con árboles poco comunes y el mausoleo donde descansa la pareja. Justo
    encima, el parque de Pairumani es el inicio de una subida exigente al Tunari por su
    cara sur.
  todo:
    - Visita guiada de Villa Albina y sus jardines
    - El mausoleo de Simón y Albina Patiño
    - Caminata desde el parque de Pairumani hacia las alturas del Tunari
  tips: >-
    Visitas en grupos pequeños, en la mañana de martes a sábado: reserva por teléfono antes
    de ir. Trufi desde la plaza de Quillacollo, o taxi desde Cochabamba (unos 40 min). El
    Palacio Portales, en la ciudad, complementa bien la visita.
