fr:
  name: Cobija
  label: Cobija
  short: "La capitale du Pando, au bord du río Acre, face au Brésil : porte de l'Amazonie du nord."
  story: >-
    Tout au nord du pays, Cobija est la petite capitale du département du Pando, au bord du
    río Acre, face à la ville brésilienne de Brasiléia. C'est une ville tranquille et verte,
    qui vit de la noix du Brésil (la castaña) et du commerce avec le pays voisin. On y vient
    pour l'Amazonie la moins visitée de Bolivie : la réserve de Manuripi, ses lacs et ses
    forêts, où l'on observe une faune remarquable loin des circuits classiques.
  todo:
    - Promenade au bord du río Acre et passage vers Brasiléia (Brésil)
    - "Réserve amazonienne de Manuripi : lacs, forêt et faune"
    - Places et vie de la ville frontière
    - La castaña (noix du Brésil), richesse de la région
  tips: >-
    On y arrive surtout en avion depuis La Paz (environ 1 h). La route est très longue et
    souvent difficile en saison des pluies. Peu d'infrastructures touristiques : organisez
    la visite de Manuripi à l'avance.
en:
  name: Cobija
  label: Cobija
  short: "The capital of Pando, on the Acre river facing Brazil: gateway to the northern Amazon."
  story: >-
    At the very north of the country, Cobija is the small capital of Pando department, on
    the Acre river across from the Brazilian town of Brasiléia. It's a quiet, green town
    that lives from Brazil nuts (castaña) and trade with its neighbour. People come for
    Bolivia's least-visited Amazon: the Manuripi reserve, with its lakes and forests and
    remarkable wildlife, far from the usual routes.
  todo:
    - Walk along the Acre river and cross to Brasiléia (Brazil)
    - "Manuripi Amazon reserve: lakes, forest and wildlife"
    - Squares and border-town life
    - Brazil nuts (castaña), the region's treasure
  tips: >-
    Most people fly in from La Paz (about 1 h). The road is very long and often hard going
    in the rainy season. Little tourist infrastructure: arrange a Manuripi visit in advance.
es:
  name: Cobija
  label: Cobija
  short: >-
    La capital de Pando, a orillas del río Acre, frente a Brasil: puerta de la Amazonía del
    norte.
  story: >-
    En el extremo norte del país, Cobija es la pequeña capital del departamento de Pando, a
    orillas del río Acre, frente a la ciudad brasileña de Brasiléia. Es una ciudad tranquila
    y verde que vive de la castaña y del comercio con el país vecino. Se viene por la
    Amazonía menos visitada de Bolivia: la reserva de Manuripi, con sus lagos, bosques y una
    fauna notable, lejos de los circuitos clásicos.
  todo:
    - Paseo a orillas del río Acre y paso a Brasiléia (Brasil)
    - "Reserva amazónica Manuripi: lagos, bosque y fauna"
    - Plazas y vida de ciudad fronteriza
    - La castaña, riqueza de la región
  tips: >-
    Se llega sobre todo en avión desde La Paz (alrededor de 1 h). El camino es muy largo y
    suele complicarse en época de lluvias. Poca infraestructura turística: organiza la
    visita a Manuripi con anticipación.
