fr:
  name: San Ignacio de Moxos
  label: San Ignacio de Moxos
  short: Ancienne mission jésuite des plaines du Beni, célèbre pour l'Ichapekene Piesta (UNESCO).
  story: >-
    San Ignacio de Moxos est la capitale culturelle des Llanos de Moxos, ces immenses
    plaines inondables du Beni. L'ancienne mission jésuite a gardé une forte tradition de
    musique baroque et de danses. Chaque 31 juillet, pour la fête de saint Ignace,
    l'Ichapekene Piesta, classée par l'UNESCO, rassemble les macheteros aux coiffes de
    plumes dans une fête unique en Amérique du Sud.
  todo:
    - Ichapekene Piesta et les macheteros (31 juillet)
    - Église de la mission et musique baroque de Moxos
    - Laguna Isirere et oiseaux des plaines
  tips: >-
    À 2 ou 3 h de Trinidad par une route de terre, souvent difficile en saison des pluies.
    Pour la fête, réservez très tôt.
en:
  name: San Ignacio de Moxos
  label: San Ignacio de Moxos
  short: A former Jesuit mission on the Beni plains, famous for the Ichapekene Piesta (UNESCO).
  story: >-
    San Ignacio de Moxos is the cultural capital of the Llanos de Moxos, the vast flood
    plains of the Beni. The former Jesuit mission has kept a strong tradition of baroque
    music and dance. Every 31 July, for the feast of Saint Ignatius, the UNESCO-listed
    Ichapekene Piesta brings out the macheteros in their feather headdresses for a festival
    unlike any other in South America.
  todo:
    - Ichapekene Piesta and the macheteros (31 July)
    - Mission church and the baroque music of Moxos
    - Isirere lagoon and the birds of the plains
  tips: >-
    2 to 3 h from Trinidad on a dirt road, often hard going in the rainy season. For the
    festival, book well ahead.
es:
  name: San Ignacio de Moxos
  label: San Ignacio de Moxos
  short: >-
    Antigua misión jesuítica de las llanuras del Beni, famosa por la Ichapekene Piesta
    (UNESCO).
  story: >-
    San Ignacio de Moxos es la capital cultural de los Llanos de Moxos, las inmensas
    llanuras inundables del Beni. La antigua misión jesuítica conserva una fuerte tradición
    de música barroca y danzas. Cada 31 de julio, en la fiesta de San Ignacio, la Ichapekene
    Piesta, Patrimonio de la UNESCO, saca a los macheteros con sus tocados de plumas en una
    fiesta única en Sudamérica.
  todo:
    - Ichapekene Piesta y los macheteros (31 de julio)
    - Templo misional y música barroca de Moxos
    - Laguna Isirere y aves de la llanura
  tips: >-
    A 2 o 3 h de Trinidad por camino de tierra, a menudo difícil en época de lluvias. Para
    la fiesta, reserva con mucha anticipación.
