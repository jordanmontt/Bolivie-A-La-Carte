fr:
  name: "Missions : San Ignacio de Velasco"
  label: San Ignacio
  short: Le carrefour du circuit des missions, avec sa lagune.
  story: >-
    San Ignacio de Velasco est la plus grande ville de la Chiquitanía et le carrefour du
    circuit des missions. Sa lagune et son ambiance de petite ville de province en font une
    bonne base pour rayonner vers les autres villages.
  todo:
    - Laguna Guapomó
    - Base pour Santa Ana, San Rafael et San Miguel
  tips: Le circuit complet des missions demande 5 à 7 jours.
en:
  name: "Missions: San Ignacio de Velasco"
  label: San Ignacio
  short: The hub of the missions circuit, with its lagoon.
  story: >-
    San Ignacio de Velasco is the largest town in the Chiquitanía and the hub of the
    missions circuit. Its lagoon and small-town feel make it a good base for exploring the
    other villages.
  todo:
    - Laguna Guapomó
    - Base for Santa Ana, San Rafael and San Miguel
  tips: The full missions circuit takes 5 to 7 days.
es:
  name: "Misiones: San Ignacio de Velasco"
  label: San Ignacio
  short: El cruce del circuito de las misiones, con su laguna.
  story: >-
    San Ignacio de Velasco es la ciudad más grande de la Chiquitanía y el cruce del circuito
    de las misiones. Su laguna y su ambiente de pueblo de provincia la hacen una buena base
    para visitar los otros pueblos.
  todo:
    - Laguna Guapomó
    - Base para Santa Ana, San Rafael y San Miguel
  tips: El circuito completo de las misiones toma de 5 a 7 días.
