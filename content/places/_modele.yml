# Modèle pour un nouveau lieu. Copier ce fichier en content/places/<id>.yml (ex. sorata.yml),
# le remplir, puis ajouter <id> à la liste places: de sa région dans content/regions.yml.
# Les fichiers qui commencent par _ sont ignorés par la construction.

department: La Paz            # La Paz, Oruro, Potosí, Chuquisaca, Tarija, Cochabamba, Santa Cruz, Beni ou Pando
category: nature              # ville, culture, nature, altiplano, jungle ou aventure
lat: -16.0                    # coordonnées (clic droit sur Google Maps pour les copier)
lng: -68.0
altitude: 2700                # en mètres
days: [1, 2]                  # jours sur place : [minimum, idéal]
climate: lapaz                # un des climats de content/climates.yml
dishes: [trucha, sopa_quinua] # plats de content/dishes.yml
photos:
  - file: monlieu-1.jpg       # le fichier, déposé dans photos/
    author: Nom de l'auteur
    licence: CC BY-SA 4.0
    source: https://commons.wikimedia.org/wiki/File:...
fr:
  name: Nom complet du lieu
  label: Nom court             # affiché sur la carte
  short: Une phrase qui donne envie.
  story: >-
    Trois ou quatre phrases pour raconter le lieu.
  todo:
    - Première chose à faire
    - Deuxième chose à faire
  tips: Un conseil pratique.
en:
  name: Full name
  label: Short name
  short: One sentence.
  story: >-
    Three or four sentences.
  todo:
    - First thing to do
  tips: A practical tip.
es:
  name: Nombre completo
  label: Nombre corto
  short: Una frase.
  story: >-
    Tres o cuatro frases.
  todo:
    - Primera cosa
  tips: Un consejo práctico.
