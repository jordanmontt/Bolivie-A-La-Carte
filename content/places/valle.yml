fr:
  name: "Valle Alto : Tarata et Cliza"
  label: Tarata · Cliza
  short: Villages coloniaux de la vallée, marchés et chicha.
  story: >-
    Le Valle Alto, c'est la campagne de Cochabamba : des villages coloniaux en adobe, des
    champs de maïs et les chicherías, où l'on boit la chicha (bière de maïs) dans des
    calebasses. Tarata, avec ses rues pavées et sa grande place, est l'un des plus jolis
    villages de la région. Idéal pour une journée tranquille et très locale.
  todo:
    - "Tarata : village colonial classé, couvent San José"
    - Marché du dimanche à Cliza
    - Goûter la chicha de maïs et le chicharrón local
    - Punata (marché du mardi)
  tips: Facile en demi-journée ou journée depuis Cochabamba en trufi (minibus).
en:
  name: "Valle Alto: Tarata and Cliza"
  label: Tarata and Cliza
  short: Colonial valley villages, markets and chicha.
  story: >-
    The Valle Alto is Cochabamba's countryside: adobe colonial villages, cornfields and
    chicherías, where chicha (corn beer) is served in gourds. Tarata, with its cobbled
    streets and large square, is one of the prettiest villages in the region. Ideal for a
    quiet, very local day out.
  todo:
    - "Tarata: listed colonial village, San José convent"
    - Sunday market in Cliza
    - Try corn chicha and local chicharrón
    - Punata (Tuesday market)
  tips: Easy half-day or day trip from Cochabamba by trufi (minibus).
es:
  name: "Valle Alto: Tarata y Cliza"
  label: Tarata y Cliza
  short: Pueblos coloniales del valle, mercados y chicha.
  story: >-
    El Valle Alto es el campo cochabambino: pueblos coloniales de adobe, maizales y
    chicherías donde se toma chicha en tutumas. Tarata, con sus calles empedradas y su gran
    plaza, es uno de los pueblos más lindos de la región. Ideal para un día tranquilo y muy
    local.
  todo:
    - "Tarata: pueblo colonial patrimonial, convento de San José"
    - Feria dominical de Cliza
    - Probar la chicha de maíz y el chicharrón del lugar
    - Punata (feria de los martes)
  tips: Fácil en medio día o un día desde Cochabamba en trufi.
