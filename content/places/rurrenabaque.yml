fr:
  name: Rurrenabaque
  label: Rurrenabaque
  short: Porte d'entrée de l'Amazonie bolivienne, au bord du río Beni.
  story: >-
    Rurrenabaque est une petite ville tropicale au bord du río Beni, entre les dernières
    collines des Andes et l'immense plaine amazonienne. On y arrive souvent en petit avion
    après un vol spectaculaire depuis La Paz. C'est la base pour partir dans la jungle de
    Madidi ou dans les pampas.
  todo:
    - Base pour la jungle (Madidi) et les pampas
    - Piscine naturelle El Chorro, mirador
  tips: 40 min d'avion depuis La Paz ; le bus prend 12 à 15 h.
en:
  name: Rurrenabaque
  label: Rurrenabaque
  short: Gateway to the Bolivian Amazon, on the Beni river.
  story: >-
    Rurrenabaque is a small tropical town on the Beni river, between the last foothills of
    the Andes and the vast Amazon plain. Many people arrive by small plane after a
    spectacular flight from La Paz. It's the base for trips into the Madidi jungle or the
    pampas.
  todo:
    - Base for the jungle (Madidi) and the pampas
    - El Chorro natural pool and viewpoint
  tips: 40 minutes by plane from La Paz; the bus takes 12 to 15 hours.
es:
  name: Rurrenabaque
  label: Rurrenabaque
  short: Puerta de entrada a la Amazonía boliviana, a orillas del río Beni.
  story: >-
    Rurrenabaque es un pueblo tropical a orillas del río Beni, entre las últimas colinas de
    los Andes y la inmensa llanura amazónica. Muchos llegan en avioneta tras un vuelo
    espectacular desde La Paz. Es la base para entrar a la selva de Madidi o a las pampas.
  todo:
    - Base para la selva (Madidi) y las pampas
    - Piscina natural El Chorro y mirador
  tips: 40 min de vuelo desde La Paz; en bus son 12 a 15 h.
