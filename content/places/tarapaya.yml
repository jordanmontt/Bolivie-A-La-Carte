fr:
  name: Ojo del Inca (Tarapaya)
  label: Ojo del Inca
  short: Une lagune d'eau chaude parfaitement ronde, à 30 minutes de Potosí.
  story: >-
    Près du village de Tarapaya, l'Ojo del Inca est un cratère rempli d'une eau
    naturellement chaude, d'un vert profond, où l'on peut se baigner face aux montagnes.
    Après le froid de Potosí et la visite des mines, c'est la sortie parfaite pour se
    détendre une demi-journée.
  todo:
    - Baignade dans la lagune chaude
    - Piscines thermales de Tarapaya
    - Demi-journée depuis Potosí
  tips: >-
    Minibus ou taxi depuis Potosí, puis 15 à 20 minutes de marche. La lagune est profonde :
    nagez prudemment.
en:
  name: Ojo del Inca (Tarapaya)
  label: Ojo del Inca
  short: A perfectly round warm-water lagoon, 30 minutes from Potosí.
  story: >-
    Near the village of Tarapaya, the Ojo del Inca is a crater filled with naturally warm,
    deep green water where you can swim facing the mountains. After the cold of Potosí and a
    mine visit, it's the perfect half-day outing to relax.
  todo:
    - Swim in the warm lagoon
    - Tarapaya thermal pools
    - Half a day from Potosí
  tips: >-
    Minibus or taxi from Potosí, then a 15 to 20 minute walk. The lagoon is deep: swim
    carefully.
es:
  name: Ojo del Inca (Tarapaya)
  label: Ojo del Inca
  short: Una laguna de agua caliente perfectamente redonda, a 30 minutos de Potosí.
  story: >-
    Cerca del pueblo de Tarapaya, el Ojo del Inca es un cráter lleno de agua naturalmente
    caliente, de un verde profundo, donde uno se puede bañar frente a los cerros. Después
    del frío de Potosí y de la visita a las minas, es la salida perfecta para relajarse
    medio día.
  todo:
    - Baño en la laguna caliente
    - Piscinas termales de Tarapaya
    - Medio día desde Potosí
  tips: >-
    Minibús o taxi desde Potosí, y luego 15 a 20 minutos a pie. La laguna es profunda: nada
    con cuidado.
