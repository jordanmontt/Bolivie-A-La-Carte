fr:
  name: Parc national Sajama
  label: Sajama
  short: Le plus haut sommet de Bolivie (6 542 m), geysers, sources chaudes et lamas.
  story: >-
    Le parc Sajama est l'un des paysages les plus impressionnants de Bolivie : le volcan
    Sajama, point culminant du pays à 6 542 m, se dresse au-dessus de plaines où paissent
    lamas et vigognes. On s'y baigne dans des sources chaudes en plein air avec vue sur les
    volcans enneigés, et on visite des geysers. Isolé, sauvage et très froid la nuit.
  todo:
    - Sources chaudes de Manasaya
    - Geysers de Sajama
    - Lagunas Huaña Khota
    - Église de Curahuara de Carangas (« chapelle Sixtine de l'Altiplano »)
  tips: "Très peu de transports publics : voiture ou tour. Nuits glaciales, hébergement simple."
en:
  name: Sajama National Park
  label: Sajama
  short: Bolivia's highest peak (6,542 m), geysers, hot springs and llamas.
  story: >-
    Sajama is one of Bolivia's most striking landscapes: the Sajama volcano, the country's
    highest point at 6,542 m, rises above plains where llamas and vicuñas graze. You soak in
    open-air hot springs with views of snowy volcanoes and visit geysers. Remote, wild and
    very cold at night.
  todo:
    - Manasaya hot springs
    - Sajama geysers
    - Huaña Khota lagoons
    - Church of Curahuara de Carangas (the “Sistine Chapel of the Altiplano”)
  tips: "Very little public transport: car or tour. Freezing nights, basic lodging."
es:
  name: Parque Nacional Sajama
  label: Sajama
  short: La cumbre más alta de Bolivia (6542 m), géiseres, aguas termales y llamas.
  story: >-
    El parque Sajama es uno de los paisajes más impresionantes de Bolivia: el volcán Sajama,
    punto más alto del país con 6542 m, se alza sobre planicies donde pastan llamas y
    vicuñas. Uno se baña en aguas termales al aire libre con vista a los volcanes nevados y
    visita géiseres. Aislado, salvaje y muy frío de noche.
  todo:
    - Aguas termales de Manasaya
    - Géiseres de Sajama
    - Lagunas Huaña Khota
    - Iglesia de Curahuara de Carangas (la «Capilla Sixtina del Altiplano»)
  tips: "Muy poco transporte público: auto o tour. Noches heladas, alojamiento sencillo."
