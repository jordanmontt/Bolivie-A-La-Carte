fr:
  name: Réserve de biosphère du Beni
  label: Réserve du Beni
  short: >-
    Savanes, forêts et lagunes près de San Borja : une réserve très riche en faune, encore
    peu visitée.
  story: >-
    Près de San Borja, la réserve de biosphère du Beni et sa station biologique protègent
    des savanes inondées, des îlots de forêt et des lagunes. On y observe des centaines
    d'espèces d'oiseaux, des singes et des caïmans, avec des gardes du parc ou des guides
    locaux. Une Amazonie très sauvage, pour voyageurs patients.
  todo:
    - Observation des oiseaux dans les savanes
    - Lagunes, caïmans et singes
    - Sorties avec les gardes du parc
  tips: >-
    Accès par San Borja, à organiser sur place (voiture avec chauffeur ou guide). Plutôt en
    saison sèche.
en:
  name: Beni Biosphere Reserve
  label: Beni reserve
  short: >-
    Savannas, forests and lagoons near San Borja: a reserve rich in wildlife, still rarely
    visited.
  story: >-
    Near San Borja, the Beni Biosphere Reserve and its biological station protect flooded
    savannas, forest islands and lagoons. You can see hundreds of bird species, monkeys and
    caimans, with park rangers or local guides. A very wild Amazon, for patient travellers.
  todo:
    - Birdwatching in the savannas
    - Lagoons, caimans and monkeys
    - Outings with the park rangers
  tips: >-
    Reached via San Borja, to arrange there (car with driver or guide). Best in the dry
    season.
es:
  name: Reserva de la Biosfera del Beni
  label: Reserva del Beni
  short: >-
    Sabanas, bosques y lagunas cerca de San Borja: una reserva muy rica en fauna, todavía
    poco visitada.
  story: >-
    Cerca de San Borja, la Reserva de la Biosfera del Beni y su estación biológica protegen
    sabanas inundables, islas de bosque y lagunas. Se ven cientos de especies de aves, monos
    y caimanes, con guardaparques o guías locales. Una Amazonía muy salvaje, para viajeros
    pacientes.
  todo:
    - Observación de aves en las sabanas
    - Lagunas, caimanes y monos
    - Salidas con los guardaparques
  tips: Se llega por San Borja, a organizar allí (auto con chofer o guía). Mejor en época seca.
