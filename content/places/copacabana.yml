fr:
  name: Copacabana (lac Titicaca)
  label: Copacabana
  short: Petite ville au bord du lac Titicaca, porte d'entrée vers l'Isla del Sol.
  story: >-
    Copacabana est une petite ville de pèlerinage sur la rive du lac Titicaca, avec sa
    grande basilique blanche aux coupoles mauresques. On y mange la truite du lac sur la
    plage et on regarde le coucher de soleil depuis la colline du Calvario. C'est la porte
    d'entrée vers l'Isla del Sol.
  todo:
    - Basilique de la Virgen de Copacabana
    - Coucher de soleil depuis le Cerro Calvario
    - Truite du lac sur la plage
  tips: Traversée du détroit de Tiquina en barque (le bus traverse sur une barge).
en:
  name: Copacabana (Lake Titicaca)
  label: Copacabana
  short: A small town on the shore of Lake Titicaca, gateway to the Isla del Sol.
  story: >-
    Copacabana is a small pilgrimage town on the shore of Lake Titicaca, with a big white
    basilica topped by Moorish domes. You eat lake trout on the beach and watch the sunset
    from Calvario hill. It's the gateway to the Isla del Sol.
  todo:
    - Basilica of the Virgen de Copacabana
    - Sunset from Cerro Calvario
    - Lake trout on the beach
  tips: You cross the Tiquina strait by boat (the bus crosses on a barge).
es:
  name: Copacabana (lago Titicaca)
  label: Copacabana
  short: Pequeña ciudad a orillas del lago Titicaca, puerta de entrada a la Isla del Sol.
  story: >-
    Copacabana es una pequeña ciudad de peregrinación a orillas del Titicaca, con su gran
    basílica blanca de cúpulas moriscas. Se come trucha del lago en la playa y se mira el
    atardecer desde el cerro Calvario. Es la puerta de entrada a la Isla del Sol.
  todo:
    - Basílica de la Virgen de Copacabana
    - Atardecer desde el Cerro Calvario
    - Trucha del lago en la playa
  tips: El estrecho de Tiquina se cruza en lancha (el bus pasa en una barcaza).
