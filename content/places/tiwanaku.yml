fr:
  name: Tiwanaku
  label: Tiwanaku
  short: "Site préinca classé UNESCO : Porte du Soleil, temple de Kalasasaya."
  story: >-
    Bien avant les Incas, Tiwanaku était la capitale d'un empire qui dominait les Andes. On
    y voit la célèbre Porte du Soleil, des statues monumentales et les pierres
    incroyablement bien taillées de Puma Punku. Un incontournable pour comprendre l'histoire
    des Andes, à une heure et demie de La Paz.
  todo:
    - Porte du Soleil et Kalasasaya
    - Pyramide d'Akapana et temple semi-souterrain
    - Les deux musées sur place
    - Puma Punku et ses pierres taillées
  tips: Journée depuis La Paz. Un guide sur place rend la visite bien plus intéressante.
en:
  name: Tiwanaku
  label: Tiwanaku
  short: "UNESCO-listed pre-Inca site: the Gate of the Sun and the Kalasasaya temple."
  story: >-
    Long before the Incas, Tiwanaku was the capital of an empire that ruled the Andes.
    You'll see the famous Gate of the Sun, monumental statues and the astonishingly precise
    stonework of Puma Punku. A must for understanding Andean history, an hour and a half
    from La Paz.
  todo:
    - Gate of the Sun and Kalasasaya
    - Akapana pyramid and the semi-subterranean temple
    - The two on-site museums
    - Puma Punku and its cut stones
  tips: Day trip from La Paz. A local guide makes the visit much more interesting.
es:
  name: Tiwanaku
  label: Tiwanaku
  short: "Sitio preinca Patrimonio de la UNESCO: la Puerta del Sol y el templo de Kalasasaya."
  story: >-
    Mucho antes de los incas, Tiwanaku fue la capital de un imperio que dominaba los Andes.
    Ahí están la famosa Puerta del Sol, estatuas monumentales y las piedras increíblemente
    bien talladas de Puma Punku. Imprescindible para entender la historia andina, a una hora
    y media de La Paz.
  todo:
    - Puerta del Sol y Kalasasaya
    - Pirámide de Akapana y templo semisubterráneo
    - Los dos museos del sitio
    - Puma Punku y sus piedras talladas
  tips: Un día desde La Paz. Con un guía local la visita es mucho más interesante.
