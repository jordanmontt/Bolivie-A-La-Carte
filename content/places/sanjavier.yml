fr:
  name: "Missions : San Javier"
  label: San Javier
  short: Première des missions jésuites de Chiquitos (UNESCO), églises en bois peint.
  story: >-
    San Javier est la première des missions jésuites de Chiquitos, classées par l'UNESCO :
    des églises en bois peint du XVIIIe siècle, construites par les Jésuites et les peuples
    chiquitanos au milieu de la forêt. Un village paisible et une belle introduction au
    circuit des missions.
  todo:
    - Église de 1752 restaurée
    - Village paisible, fromageries
  tips: Premier arrêt du circuit des missions depuis Santa Cruz.
en:
  name: "Missions: San Javier"
  label: San Javier
  short: The first of the Jesuit missions of Chiquitos (UNESCO), with painted wooden churches.
  story: >-
    San Javier is the first of the UNESCO-listed Jesuit missions of Chiquitos: 18th-century
    painted wooden churches built by the Jesuits and the Chiquitano peoples in the middle of
    the forest. A peaceful village and a lovely introduction to the missions circuit.
  todo:
    - Restored church from 1752
    - Peaceful village and cheese makers
  tips: First stop on the missions circuit from Santa Cruz.
es:
  name: "Misiones: San Javier"
  label: San Javier
  short: >-
    La primera de las misiones jesuíticas de Chiquitos (UNESCO), con templos de madera
    pintada.
  story: >-
    San Javier es la primera de las misiones jesuíticas de Chiquitos, Patrimonio de la
    UNESCO: templos de madera pintada del siglo XVIII, construidos por los jesuitas y los
    pueblos chiquitanos en medio del bosque. Un pueblo apacible y una linda introducción al
    circuito de las misiones.
  todo:
    - Templo de 1752 restaurado
    - Pueblo tranquilo, queserías
  tips: Primera parada del circuito de misiones desde Santa Cruz.
