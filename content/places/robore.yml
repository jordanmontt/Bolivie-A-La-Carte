fr:
  name: Roboré
  label: Roboré
  short: >-
    Petite ville tranquille de la Chiquitanía, base pour Santiago de Chiquitos, Chochís et
    Aguas Calientes.
  story: >-
    Roboré est une petite ville tranquille de la Chiquitanía, sur la ligne de train qui va
    vers le Brésil. On y vient surtout pour les merveilles naturelles alentour, Santiago,
    Chochís et la rivière chaude d'Aguas Calientes, et on profite au retour de ses piscines
    naturelles et de sa cuisine chiquitana.
  todo:
    - Balnéaire Los Hoyos (piscines naturelles)
    - Point de départ des excursions dans la serranía
    - Manger un majadito ou un locro de gallina
  tips: Sur la ligne de train Santa Cruz – Puerto Quijarro, et sur la Ruta 4 asphaltée.
en:
  name: Roboré
  label: Roboré
  short: >-
    A quiet small town in the Chiquitanía, a base for Santiago de Chiquitos, Chochís and
    Aguas Calientes.
  story: >-
    Roboré is a quiet small town in the Chiquitanía, on the railway to Brazil. People come
    mainly for the natural wonders around it, Santiago, Chochís and the hot river of Aguas
    Calientes, and enjoy its natural pools and Chiquitano food on the way back.
  todo:
    - Los Hoyos (natural pools)
    - Starting point for trips into the hills
    - Eat a majadito or a locro de gallina
  tips: On the Santa Cruz to Puerto Quijarro railway, and on the paved Ruta 4.
es:
  name: Roboré
  label: Roboré
  short: >-
    Pueblo tranquilo de la Chiquitanía, base para Santiago de Chiquitos, Chochís y Aguas
    Calientes.
  story: >-
    Roboré es un pueblo tranquilo de la Chiquitanía, en la línea del tren que va a Brasil.
    Se viene sobre todo por las maravillas naturales de alrededor, Santiago, Chochís y el
    río caliente de Aguas Calientes, y a la vuelta se disfrutan sus pozas naturales y su
    comida chiquitana.
  todo:
    - Balneario Los Hoyos (pozas naturales)
    - Punto de partida de excursiones a la serranía
    - Comer un majadito o un locro de gallina
  tips: En la línea de tren Santa Cruz – Puerto Quijarro y en la Ruta 4 asfaltada.
