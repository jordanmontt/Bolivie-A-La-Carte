fr:
  name: Laguna Alalay
  label: Laguna Alalay
  short: Une grande lagune au cœur de Cochabamba, refuge d'oiseaux au pied des collines.
  story: >-
    Dans le sud de Cochabamba, la Laguna Alalay est une grande étendue d'eau entourée de
    roseaux, où vivent et passent de nombreux oiseaux. Un chemin en fait le tour, avec le
    Cristo de la Concordia et les montagnes en toile de fond. Une respiration verte en
    pleine ville, idéale tôt le matin.
  todo:
    - Tour de la lagune à pied ou à vélo
    - Observation des oiseaux
    - Vue sur le Cristo de la Concordia
  tips: Accessible en taxi ou en micro depuis le centre. Mieux le matin, en journée.
en:
  name: Laguna Alalay
  label: Laguna Alalay
  short: A large lagoon in the heart of Cochabamba, a bird refuge below the hills.
  story: >-
    In the south of Cochabamba, Laguna Alalay is a wide stretch of water ringed with reeds,
    where many birds live or stop over. A path runs around it, with the Cristo de la
    Concordia and the mountains as a backdrop. A green breather in the middle of the city,
    best early in the morning.
  todo:
    - Walk or cycle around the lagoon
    - Birdwatching
    - View of the Cristo de la Concordia
  tips: By taxi or micro from the centre. Best in the morning, in daylight.
es:
  name: Laguna Alalay
  label: Laguna Alalay
  short: Una gran laguna en el corazón de Cochabamba, refugio de aves al pie de los cerros.
  story: >-
    En el sur de Cochabamba, la Laguna Alalay es un gran espejo de agua rodeado de totora,
    donde viven y pasan muchas aves. Un camino la rodea, con el Cristo de la Concordia y las
    montañas de fondo. Un respiro verde en plena ciudad, ideal temprano en la mañana.
  todo:
    - Vuelta a la laguna a pie o en bici
    - Observación de aves
    - Vista al Cristo de la Concordia
  tips: En taxi o micro desde el centro. Mejor en la mañana, de día.
