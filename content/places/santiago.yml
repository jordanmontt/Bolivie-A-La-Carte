fr:
  name: Santiago de Chiquitos
  label: Santiago de Chiquitos
  short: >-
    Ancien village de mission perché sur la serranía : miradors, randonnées, grottes et
    cascades.
  story: >-
    Santiago de Chiquitos est un ancien village de mission perché sur un plateau, avec des
    maisons basses autour d'une grande place herbeuse. On y part en randonnée vers des
    miradors à couper le souffle sur la vallée de Tucavaca, des grottes aux peintures
    rupestres et des arches de pierre. Le village est plus frais que la plaine, et vraiment
    hors du temps.
  todo:
    - Mirador del Valle de Tucavaca au coucher du soleil
    - Cueva de Juan Miserandino et peintures rupestres
    - Arco de Piedra et cascades
    - Église de mission
  tips: Plus frais que Roboré grâce à l'altitude. Guides et petits hôtels au village.
en:
  name: Santiago de Chiquitos
  label: Santiago de Chiquitos
  short: "An old mission village up in the hills: viewpoints, hikes, caves and waterfalls."
  story: >-
    Santiago de Chiquitos is an old mission village perched on a plateau, with low houses
    around a large grassy square. From here you hike to breathtaking viewpoints over the
    Tucavaca valley, caves with rock paintings and stone arches. The village is cooler than
    the plains, and truly timeless.
  todo:
    - Mirador del Valle de Tucavaca at sunset
    - Cueva de Juan Miserandino and rock paintings
    - Arco de Piedra and waterfalls
    - Mission church
  tips: Cooler than Roboré thanks to the altitude. Guides and small hotels in the village.
es:
  name: Santiago de Chiquitos
  label: Santiago de Chiquitos
  short: "Antiguo pueblo misional en la serranía: miradores, caminatas, cuevas y cascadas."
  story: >-
    Santiago de Chiquitos es un antiguo pueblo misional sobre una meseta, con casas bajas
    alrededor de una gran plaza de pasto. Desde ahí se camina a miradores impresionantes
    sobre el valle de Tucavaca, cuevas con pinturas rupestres y arcos de piedra. El pueblo
    es más fresco que el llano y está fuera del tiempo.
  todo:
    - Mirador del Valle de Tucavaca al atardecer
    - Cueva de Juan Miserandino y pinturas rupestres
    - Arco de Piedra y cascadas
    - Templo misional
  tips: Más fresco que Roboré gracias a la altura. Guías y pequeños hoteles en el pueblo.
