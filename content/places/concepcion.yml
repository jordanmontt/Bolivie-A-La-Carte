fr:
  name: "Missions : Concepción"
  label: Concepción
  short: La plus belle place des missions, atelier de restauration et musée.
  story: >-
    Concepción a sans doute la plus belle église de toutes les missions, avec sa façade
    peinte et ses colonnes en bois sculpté. Le village vit au rythme de la musique baroque,
    encore jouée par les jeunes de la région, et accueille un festival renommé.
  todo:
    - Cathédrale et place à arcades
    - Musée misional
    - Concerts de musique baroque (festival international les années paires, en avril)
  tips: Bonne base pour dormir sur le circuit.
en:
  name: "Missions: Concepción"
  label: Concepción
  short: The most beautiful square of the missions, with a restoration workshop and a museum.
  story: >-
    Concepción probably has the most beautiful church of all the missions, with its painted
    façade and carved wooden columns. The village lives to the rhythm of baroque music,
    still played by young people from the region, and hosts a renowned festival.
  todo:
    - Cathedral and arcaded square
    - Mission museum
    - Baroque music concerts (international festival in even-numbered years, in April)
  tips: A good place to spend the night on the circuit.
es:
  name: "Misiones: Concepción"
  label: Concepción
  short: La plaza más linda de las misiones, con taller de restauración y museo.
  story: >-
    Concepción tiene quizás el templo más bello de todas las misiones, con su fachada
    pintada y sus columnas de madera tallada. El pueblo vive al ritmo de la música barroca,
    que todavía tocan los jóvenes de la región, y recibe un festival reconocido.
  todo:
    - Catedral y plaza con galerías
    - Museo misional
    - Conciertos de música barroca (festival internacional en años pares, en abril)
  tips: Buena base para dormir en el circuito.
