fr:
  name: Valle de la Concepción
  label: Bodegas de Tarija
  short: Les caves à vin et à singani de Tarija.
  story: >-
    Autour de Tarija, et surtout dans la vallée de la Concepción (Uriondo), les bodegas
    ouvrent leurs portes pour faire goûter vins et singani. Certaines sont de grandes caves
    modernes, d'autres de petites maisons familiales. Une journée parfaite pour les amateurs
    de vin.
  todo:
    - Dégustations dans les bodegas de la région (Kohlberg, Aranjuez, Campos de Solana…)
    - Village de Concepción
  tips: Journée depuis Tarija, en tour ou en taxi.
en:
  name: Valle de la Concepción
  label: Tarija wineries
  short: Tarija's wine and singani cellars.
  story: >-
    Around Tarija, and especially in the Concepción valley (Uriondo), the bodegas open their
    doors for wine and singani tastings. Some are large modern wineries, others small family
    houses. A perfect day for wine lovers.
  todo:
    - Tastings at the region's bodegas (Kohlberg, Aranjuez, Campos de Solana…)
    - The village of Concepción
  tips: Day trip from Tarija, on a tour or by taxi.
es:
  name: Valle de la Concepción
  label: Bodegas de Tarija
  short: Las bodegas de vino y singani de Tarija.
  story: >-
    Alrededor de Tarija, y sobre todo en el valle de la Concepción (Uriondo), las bodegas
    abren sus puertas para degustar vinos y singani. Algunas son grandes bodegas modernas,
    otras pequeñas casas familiares. Un día perfecto para los amantes del vino.
  todo:
    - Degustaciones en las bodegas de la región (Kohlberg, Aranjuez, Campos de Solana…)
    - El pueblo de Concepción
  tips: Un día desde Tarija, en tour o en taxi.
