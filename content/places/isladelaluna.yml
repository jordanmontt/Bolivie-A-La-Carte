fr:
  name: Isla de la Luna
  label: Isla de la Luna
  short: Petite île voisine avec le temple des Vierges du Soleil (Iñak Uyu).
  story: >-
    Plus petite et plus calme que sa voisine, l'Isla de la Luna abritait le temple des
    Vierges du Soleil, des femmes choisies au service du culte inca. Une escale rapide en
    bateau, qui se combine facilement avec l'Isla del Sol.
  todo:
    - Temple d'Iñak Uyu
    - Combinable avec l'Isla del Sol dans la même journée
  tips: Bateaux depuis Copacabana ou Yumani.
en:
  name: Isla de la Luna
  label: Isla de la Luna
  short: A small neighbouring island with the temple of the Virgins of the Sun (Iñak Uyu).
  story: >-
    Smaller and quieter than its neighbour, the Isla de la Luna was home to the temple of
    the Virgins of the Sun, women chosen to serve the Inca cult. A short boat stop that's
    easy to combine with the Isla del Sol.
  todo:
    - Iñak Uyu temple
    - Combine with the Isla del Sol on the same day
  tips: Boats from Copacabana or Yumani.
es:
  name: Isla de la Luna
  label: Isla de la Luna
  short: Pequeña isla vecina con el templo de las Vírgenes del Sol (Iñak Uyu).
  story: >-
    Más pequeña y tranquila que su vecina, la Isla de la Luna albergaba el templo de las
    Vírgenes del Sol, mujeres elegidas para servir al culto inca. Una parada corta en bote
    que se combina fácilmente con la Isla del Sol.
  todo:
    - Templo de Iñak Uyu
    - Combinable con la Isla del Sol el mismo día
  tips: Botes desde Copacabana o Yumani.
