fr:
  name: Pampas du Yacuma
  label: Pampas
  short: "Zones humides : on voit beaucoup d'animaux (caïmans, capybaras, dauphins roses)."
  story: >-
    Les pampas du Yacuma sont des zones humides où l'on voit énormément d'animaux en très
    peu de temps : caïmans, capybaras, singes, oiseaux par centaines et dauphins roses de
    rivière. Moins sauvage que la jungle, mais beaucoup plus facile pour observer la faune.
  todo:
    - Balade en bateau sur le río Yacuma
    - >-
      Observer les dauphins roses (certains tours proposent de nager près d'eux, sans les
      toucher)
    - Coucher de soleil sur la pampa
  tips: >-
    Tour de 3 jours depuis Rurrenabaque. Choisissez une agence qui respecte les animaux : on
    ne nourrit pas et on ne touche pas la faune.
en:
  name: Yacuma Pampas
  label: Pampas
  short: "Wetlands teeming with animals: caimans, capybaras and pink river dolphins."
  story: >-
    The Yacuma pampas are wetlands where you see an enormous number of animals in very
    little time: caimans, capybaras, monkeys, hundreds of birds and pink river dolphins.
    Less wild than the jungle, but much easier for spotting wildlife.
  todo:
    - Boat trip on the Yacuma river
    - Watch pink river dolphins (some tours offer a swim near them, without touching)
    - Sunset over the pampa
  tips: >-
    3-day tour from Rurrenabaque. Pick an agency that respects the animals: no feeding and
    no handling wildlife.
es:
  name: Pampas del Yacuma
  label: Pampas
  short: "Humedales llenos de animales: caimanes, capibaras y delfines rosados."
  story: >-
    Las pampas del Yacuma son humedales donde se ven muchísimos animales en poco tiempo:
    caimanes, capibaras, monos, cientos de aves y delfines rosados de río. Menos salvaje que
    la selva, pero mucho más fácil para ver fauna.
  todo:
    - Paseo en bote por el río Yacuma
    - Ver los delfines rosados (algunos tours ofrecen nadar cerca, sin tocarlos)
    - Atardecer en la pampa
  tips: >-
    Tour de 3 días desde Rurrenabaque. Elige una agencia que respete a los animales: no se
    alimenta ni se toca la fauna.
