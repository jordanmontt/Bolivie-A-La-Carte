fr:
  name: Samaipata
  label: Samaipata
  short: "Village bohème entre Andes et forêt : El Fuerte (UNESCO) et le parc Amboró."
  story: >-
    Samaipata est un village charmant et tranquille, entre les Andes et la forêt, où
    beaucoup de voyageurs restent plus longtemps que prévu. On y visite El Fuerte, un énorme
    rocher sculpté par les peuples préincas, on se promène parmi les fougères géantes
    d'Amboró et on observe les condors. Bons restaurants, ambiance détendue et climat
    agréable.
  todo:
    - "El Fuerte de Samaipata : rocher sculpté préinca"
    - Forêt de fougères géantes d'Amboró
    - Cascadas Las Cuevas
    - Condors à La Pajcha / Codo de los Andes
  tips: Étape idéale sur l'ancienne route Cochabamba – Santa Cruz. Climat doux.
en:
  name: Samaipata
  label: Samaipata
  short: "A bohemian village between the Andes and the forest: El Fuerte (UNESCO) and Amboró park."
  story: >-
    Samaipata is a charming, peaceful village between the Andes and the forest, where many
    travellers stay longer than planned. You visit El Fuerte, a huge rock carved by pre-Inca
    peoples, walk among the giant ferns of Amboró and watch condors. Good restaurants, a
    relaxed vibe and a pleasant climate.
  todo:
    - "El Fuerte de Samaipata: a pre-Inca carved rock"
    - Amboró's giant fern forest
    - Las Cuevas waterfalls
    - Condors at La Pajcha and Codo de los Andes
  tips: An ideal stop on the old Cochabamba to Santa Cruz road. Mild climate.
es:
  name: Samaipata
  label: Samaipata
  short: "Pueblo bohemio entre Andes y bosque: El Fuerte (UNESCO) y el parque Amboró."
  story: >-
    Samaipata es un pueblo encantador y tranquilo, entre los Andes y el bosque, donde muchos
    viajeros se quedan más de lo previsto. Se visita El Fuerte, una enorme roca tallada por
    pueblos preincas, se camina entre los helechos gigantes de Amboró y se observan
    cóndores. Buenos restaurantes, ambiente relajado y clima agradable.
  todo:
    - "El Fuerte de Samaipata: roca tallada preinca"
    - Bosque de helechos gigantes de Amboró
    - Cascadas Las Cuevas
    - Cóndores en La Pajcha y el Codo de los Andes
  tips: Parada ideal en la carretera antigua Cochabamba – Santa Cruz. Clima templado.
