fr:
  name: Huayna Potosí
  label: Huayna Potosí
  short: Un « 6 000 » réputé accessible, ascension guidée en 2 ou 3 jours.
  story: >-
    Le Huayna Potosí (6 088 m) est l'un des « 6 000 » les plus accessibles au monde : en
    deux ou trois jours, avec un guide, on passe par un refuge puis on marche sur le glacier
    jusqu'au sommet au lever du soleil. Une vraie expédition, réservée à ceux qui sont bien
    acclimatés et en bonne forme.
  todo:
    - Ascension guidée (glacier, crampons)
    - Ou simple journée au refuge et au glacier de Zongo
  tips: >-
    Exige une très bonne acclimatation (au moins une semaine en altitude). Agences sérieuses
    à La Paz.
en:
  name: Huayna Potosí
  label: Huayna Potosí
  short: A 6,000 m peak known as one of the most accessible, with a guided 2 or 3-day climb.
  story: >-
    Huayna Potosí (6,088 m) is one of the most accessible 6,000 m peaks in the world: in two
    or three days with a guide, you stay at a refuge and then walk up the glacier to reach
    the summit at sunrise. A real expedition, only for people who are well acclimatised and
    fit.
  todo:
    - Guided ascent (glacier, crampons)
    - Or just a day trip to the refuge and the Zongo glacier
  tips: >-
    Requires very good acclimatisation (at least a week at altitude). Use a reputable agency
    in La Paz.
es:
  name: Huayna Potosí
  label: Huayna Potosí
  short: Un «seismil» conocido por ser accesible, con ascenso guiado en 2 o 3 días.
  story: >-
    El Huayna Potosí (6088 m) es uno de los seismiles más accesibles del mundo: en dos o
    tres días, con guía, se duerme en un refugio y luego se camina por el glaciar hasta la
    cumbre al amanecer. Una verdadera expedición, solo para quienes están bien aclimatados y
    en buena forma.
  todo:
    - Ascenso guiado (glaciar, crampones)
    - O solo un día al refugio y al glaciar de Zongo
  tips: >-
    Exige una muy buena aclimatación (al menos una semana en la altura). Agencias serias en
    La Paz.
