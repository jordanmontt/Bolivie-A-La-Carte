fr:
  name: Parc national Amboró
  label: Amboró
  short: Forêts de nuages et de fougères arborescentes, très riche en oiseaux.
  story: >-
    Le parc Amboró est l'un des plus riches en biodiversité du continent : forêts de nuages,
    fougères arborescentes de plusieurs mètres de haut, toucans et coqs-de-roche. On
    l'explore à pied avec un guide depuis Samaipata. On a l'impression de marcher dans un
    paysage préhistorique.
  todo:
    - Sentier des fougères géantes (secteur La Yunga)
    - Refugio Los Volcanes
    - "Oiseaux : coqs-de-roche, toucans"
  tips: Accès depuis Samaipata avec guide.
en:
  name: Amboró National Park
  label: Amboró
  short: Cloud forests and tree ferns, very rich in birds.
  story: >-
    Amboró is one of the most biodiverse parks on the continent: cloud forests, tree ferns
    several metres tall, toucans and cocks-of-the-rock. You explore it on foot with a guide
    from Samaipata. It feels like walking through a prehistoric landscape.
  todo:
    - Giant fern trail (La Yunga sector)
    - Refugio Los Volcanes
    - "Birds: cocks-of-the-rock, toucans"
  tips: Access from Samaipata with a guide.
es:
  name: Parque Nacional Amboró
  label: Amboró
  short: Bosques de nubes y helechos arborescentes, muy rico en aves.
  story: >-
    El parque Amboró es uno de los más ricos en biodiversidad del continente: bosques de
    nubes, helechos arborescentes de varios metros, tucanes y gallitos de las rocas. Se
    recorre a pie con guía desde Samaipata. Uno se siente caminando en un paisaje
    prehistórico.
  todo:
    - Sendero de los helechos gigantes (sector La Yunga)
    - Refugio Los Volcanes
    - "Aves: gallitos de las rocas, tucanes"
  tips: Acceso desde Samaipata con guía.
