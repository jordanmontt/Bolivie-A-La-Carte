fr:
  name: Chochís et la Torre de David
  label: Chochís
  short: >-
    Une immense falaise rouge, la Torre de David, avec un sanctuaire à ses pieds et des
    cascades dans la vallée de Tucavaca.
  story: >-
    À Chochís, une gigantesque falaise de grès rouge, la Torre de David, domine la forêt. À
    ses pieds, un sanctuaire construit après une catastrophe naturelle se fond dans la
    roche. On peut grimper jusqu'en haut pour une vue magnifique sur la vallée de Tucavaca,
    puis se baigner sous les cascades.
  todo:
    - Sanctuaire marial de Chochís, construit au pied de la falaise
    - Montée à la Torre de David (vue sur toute la vallée)
    - Cascades et baignade dans la vallée de Tucavaca
  tips: >-
    Sur la route et la voie ferrée entre San José et Roboré. Mieux avec un guide local
    depuis Roboré.
en:
  name: Chochís and the Torre de David
  label: Chochís
  short: >-
    A huge red cliff, the Torre de David, with a sanctuary at its foot and waterfalls in the
    Tucavaca valley.
  story: >-
    In Chochís, a gigantic red sandstone cliff, the Torre de David, towers over the forest.
    At its foot, a sanctuary built after a natural disaster blends into the rock. You can
    climb to the top for a magnificent view of the Tucavaca valley, then swim under the
    waterfalls.
  todo:
    - Chochís Marian sanctuary, built at the foot of the cliff
    - Climb the Torre de David (view over the whole valley)
    - Waterfalls and swimming in the Tucavaca valley
  tips: On the road and railway between San José and Roboré. Best with a local guide from Roboré.
es:
  name: Chochís y la Torre de David
  label: Chochís
  short: >-
    Un enorme farallón rojo, la Torre de David, con un santuario a sus pies y cascadas en el
    valle de Tucavaca.
  story: >-
    En Chochís, un gigantesco farallón de arenisca roja, la Torre de David, domina el
    bosque. A sus pies, un santuario construido después de un desastre natural se funde con
    la roca. Se puede subir hasta arriba para una vista magnífica del valle de Tucavaca y
    luego bañarse bajo las cascadas.
  todo:
    - Santuario mariano de Chochís, al pie del farallón
    - Subida a la Torre de David (vista de todo el valle)
    - Cascadas y baño en el valle de Tucavaca
  tips: >-
    En la carretera y la vía férrea entre San José y Roboré. Mejor con un guía local desde
    Roboré.
