fr:
  name: Guayaramerín
  label: Guayaramerín
  short: Ville frontière sur le río Mamoré, face à la ville brésilienne de Guajará-Mirim.
  story: >-
    Guayaramerín est une petite ville frontière animée, au bord du large río Mamoré. On
    traverse le fleuve en bateau pour passer au Brésil, à Guajará-Mirim. Avec Riberalta,
    c'est la base pour découvrir Cachuela Esperanza et ses rapides, et l'Amazonie du nord,
    très peu touristique.
  todo:
    - Traversée du Mamoré vers Guajará-Mirim (Brésil)
    - Cachuela Esperanza et ses rapides
    - Promenade au bord du Mamoré
  tips: >-
    À 1 h 30 de Riberalta en taxi partagé ou en bus. Pour passer au Brésil, gardez votre
    passeport sur vous.
en:
  name: Guayaramerín
  label: Guayaramerín
  short: A border town on the Mamoré river, facing the Brazilian town of Guajará-Mirim.
  story: >-
    Guayaramerín is a lively little border town on the wide Mamoré river. You cross by boat
    to Brazil, to Guajará-Mirim. With Riberalta, it's the base for Cachuela Esperanza and
    its rapids, and for the very untouristy northern Amazon.
  todo:
    - Cross the Mamoré to Guajará-Mirim (Brazil)
    - Cachuela Esperanza and its rapids
    - Walk along the Mamoré
  tips: >-
    1 h 30 from Riberalta by shared taxi or bus. To cross into Brazil, keep your passport
    with you.
es:
  name: Guayaramerín
  label: Guayaramerín
  short: Ciudad fronteriza a orillas del río Mamoré, frente a la ciudad brasileña de Guajará-Mirim.
  story: >-
    Guayaramerín es una ciudad fronteriza pequeña y animada, a orillas del ancho río Mamoré.
    Se cruza el río en lancha para pasar a Brasil, a Guajará-Mirim. Con Riberalta, es la
    base para conocer Cachuela Esperanza y sus rápidos, y la Amazonía del norte, muy poco
    turística.
  todo:
    - Cruzar el Mamoré a Guajará-Mirim (Brasil)
    - Cachuela Esperanza y sus rápidos
    - Paseo a orillas del Mamoré
  tips: A 1 h 30 de Riberalta en taxi compartido o bus. Para pasar a Brasil, lleva tu pasaporte.
