fr:
  name: Tarija
  label: Tarija
  short: "La Bolivie andalouse : vignobles d'altitude, singani et ambiance détendue."
  story: >-
    Tarija surprend tout le monde : on se croirait en Andalousie, avec ses palmiers, ses
    places tranquilles et ses vignobles. On y produit des vins d'altitude et le singani,
    l'eau-de-vie nationale. Ville douce et accueillante, parfaite pour ralentir le rythme.
  todo:
    - Route du vin et du singani (Valle de la Concepción)
    - Centre-ville et place principale
    - Réserve de Sama (lagunes et chemin inca)
  tips: Plus chaude et plus basse. Vols directs depuis Cochabamba.
en:
  name: Tarija
  label: Tarija
  short: "Bolivia's Andalusia: high-altitude vineyards, singani and a relaxed vibe."
  story: >-
    Tarija surprises everyone: with its palm trees, quiet squares and vineyards, it feels
    like Andalusia. It produces high-altitude wines and singani, the national brandy. A
    gentle, welcoming city, perfect for slowing down.
  todo:
    - Wine and singani route (Valle de la Concepción)
    - Town centre and main square
    - Sama reserve (lagoons and an Inca trail)
  tips: Warmer and lower. Direct flights from Cochabamba.
es:
  name: Tarija
  label: Tarija
  short: "La Andalucía boliviana: viñedos de altura, singani y ambiente relajado."
  story: >-
    Tarija sorprende a todos: con sus palmeras, plazas tranquilas y viñedos, parece
    Andalucía. Ahí se producen vinos de altura y el singani, el aguardiente nacional. Una
    ciudad amable y acogedora, perfecta para bajar el ritmo.
  todo:
    - Ruta del vino y del singani (Valle de la Concepción)
    - Centro y plaza principal
    - Reserva de Sama (lagunas y camino inca)
  tips: Más cálida y más baja. Vuelos directos desde Cochabamba.
