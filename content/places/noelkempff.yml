fr:
  name: Parc national Noel Kempff Mercado
  label: Noel Kempff
  short: "Parc UNESCO immense et très isolé : plateau de Huanchaca, chutes Arco Iris."
  story: >-
    Le parc Noel Kempff Mercado est l'un des endroits les plus sauvages d'Amérique du Sud :
    des plateaux tabulaires, des chutes d'eau spectaculaires et une faune exceptionnelle. On
    dit qu'il aurait inspiré « Le Monde perdu » de Conan Doyle. Très difficile d'accès et
    cher : une expédition à part entière.
  todo:
    - Chutes Arco Iris et Federico Ahlfeld
    - Faune exceptionnelle
  tips: >-
    Expédition : avionnette ou piste de 12 h+. Coûteux, à organiser à l'avance. Compter une
    semaine sur place, voyage compris.
en:
  name: Noel Kempff Mercado National Park
  label: Noel Kempff
  short: "A vast and very remote UNESCO park: the Huanchaca plateau and the Arco Iris falls."
  story: >-
    Noel Kempff Mercado is one of the wildest places in South America: table-top plateaus,
    spectacular waterfalls and exceptional wildlife. It is said to have inspired Conan
    Doyle's “The Lost World”. Very hard to reach and expensive: an expedition in its own
    right.
  todo:
    - Arco Iris and Federico Ahlfeld falls
    - Exceptional wildlife
  tips: >-
    An expedition: light aircraft or a 12-hour-plus dirt track. Expensive, to organise in
    advance. Allow a week, including travel.
es:
  name: Parque Nacional Noel Kempff Mercado
  label: Noel Kempff
  short: "Parque UNESCO inmenso y muy aislado: la meseta de Huanchaca y la catarata Arco Iris."
  story: >-
    El parque Noel Kempff Mercado es uno de los lugares más salvajes de Sudamérica: mesetas,
    cataratas espectaculares y una fauna excepcional. Se dice que inspiró «El mundo perdido»
    de Conan Doyle. Muy difícil de alcanzar y caro: una expedición en sí misma.
  todo:
    - Cataratas Arco Iris y Federico Ahlfeld
    - Fauna excepcional
  tips: >-
    Expedición: avioneta o un camino de más de 12 h. Caro, hay que organizarlo con
    anticipación. Cuenta una semana, viaje incluido.
