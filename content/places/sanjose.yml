fr:
  name: "Missions : San José de Chiquitos"
  label: San José
  short: La seule mission jésuite en pierre, au pied de la serranía.
  story: >-
    San José de Chiquitos possède la seule mission construite en pierre, un ensemble
    impressionnant face à une grande place. Tout autour, la serranía offre de belles
    balades. C'est aussi la porte d'entrée vers Chochís, Roboré et Aguas Calientes.
  todo:
    - Ensemble missionnaire en pierre
    - Parque Santa Cruz la Vieja
  tips: "Sur la route et la voie ferrée Santa Cruz – Brésil : retour facile."
en:
  name: "Missions: San José de Chiquitos"
  label: San José
  short: The only stone Jesuit mission, at the foot of the hills.
  story: >-
    San José de Chiquitos has the only mission built of stone, an impressive complex facing
    a large square. The surrounding hills offer good walks. It's also the gateway to
    Chochís, Roboré and Aguas Calientes.
  todo:
    - Stone mission complex
    - Parque Santa Cruz la Vieja
  tips: "On the road and railway between Santa Cruz and Brazil: easy to get back."
es:
  name: "Misiones: San José de Chiquitos"
  label: San José
  short: La única misión jesuítica de piedra, al pie de la serranía.
  story: >-
    San José de Chiquitos tiene la única misión construida en piedra, un conjunto
    impresionante frente a una gran plaza. Alrededor, la serranía ofrece lindas caminatas.
    También es la puerta de entrada a Chochís, Roboré y Aguas Calientes.
  todo:
    - Conjunto misional de piedra
    - Parque Santa Cruz la Vieja
  tips: "En la carretera y la vía férrea Santa Cruz – Brasil: fácil volver."
