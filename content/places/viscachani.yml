fr:
  name: Sources chaudes de Viscachani
  label: Viscachani
  short: Bains d'eau tiède sur l'Altiplano, sur la route d'Oruro, à environ 1 h 30 de La Paz.
  story: >-
    Sur la route de La Paz à Oruro, près d'Ayo Ayo, Viscachani a des bains d'eau tiède
    naturelle, simples et peu connus des voyageurs. Une pause agréable sur un long trajet en
    bus, ou une demi-journée depuis La Paz.
  todo:
    - Bains d'eau tiède
    - Pause sur la route La Paz – Oruro
    - Paysages de l'Altiplano
  tips: >-
    Minibus d'El Alto vers Patacamaya : demander l'arrêt à Viscachani, puis environ 20 min à
    pied.
