fr:
  name: Tarabuco
  label: Tarabuco
  short: Grand marché du dimanche des communautés yampara, textiles remarquables.
  story: >-
    Chaque dimanche, les communautés yampara descendent à Tarabuco pour le marché, dans
    leurs costumes traditionnels avec leurs drôles de casques en cuir. On y trouve les plus
    beaux tissages de la région. Une sortie très colorée, en aller-retour depuis Sucre.
  todo:
    - Marché du dimanche
    - Tissages et costumes traditionnels
    - Fête du Pujllay (mars)
  tips: À faire un dimanche, en aller-retour depuis Sucre.
en:
  name: Tarabuco
  label: Tarabuco
  short: Big Sunday market of the Yampara communities, with remarkable textiles.
  story: >-
    Every Sunday the Yampara communities come to Tarabuco for the market, in traditional
    dress with their curious leather helmets. You'll find the finest weavings of the region.
    A very colourful day trip from Sucre.
  todo:
    - Sunday market
    - Traditional weavings and costumes
    - Pujllay festival (March)
  tips: Go on a Sunday, as a return trip from Sucre.
es:
  name: Tarabuco
  label: Tarabuco
  short: Gran feria dominical de las comunidades yampara, con tejidos notables.
  story: >-
    Cada domingo, las comunidades yampara bajan a Tarabuco para la feria, con su ropa
    tradicional y sus curiosas monteras de cuero. Ahí se encuentran los mejores tejidos de
    la región. Una salida muy colorida, ida y vuelta desde Sucre.
  todo:
    - Feria dominical
    - Tejidos y trajes tradicionales
    - Fiesta del Pujllay (marzo)
  tips: Ve un domingo, ida y vuelta desde Sucre.
