fr:
  name: "Cordillère Royale : Condoriri"
  label: Condoriri
  short: Lagunes glaciaires et sommets enneigés, à 2 h de La Paz.
  story: >-
    Le massif du Condoriri, dont les sommets dessinent un condor aux ailes déployées,
    entoure des lagunes turquoise au pied des glaciers. On peut y faire une très belle
    journée de randonnée depuis La Paz ou un trek de deux ou trois jours en camping.
    Paysages de haute montagne garantis, et très peu de monde.
  todo:
    - Laguna Tuni et Laguna Chiar Khota
    - Trek de 2-3 jours autour du Condoriri
  tips: Guide recommandé. Nuits très froides.
en:
  name: "Cordillera Real: Condoriri"
  label: Condoriri
  short: Glacial lagoons and snowy peaks, two hours from La Paz.
  story: >-
    The Condoriri massif, whose peaks look like a condor with outstretched wings, surrounds
    turquoise lagoons at the foot of glaciers. It makes a superb day hike from La Paz or a
    two to three-day camping trek. High-mountain scenery guaranteed, with very few people.
  todo:
    - Laguna Tuni and Laguna Chiar Khota
    - 2 to 3-day trek around Condoriri
  tips: A guide is recommended. Very cold nights.
es:
  name: "Cordillera Real: Condoriri"
  label: Condoriri
  short: Lagunas glaciares y cumbres nevadas, a 2 h de La Paz.
  story: >-
    El macizo del Condoriri, cuyas cumbres dibujan un cóndor con las alas abiertas, rodea
    lagunas turquesa al pie de los glaciares. Se puede hacer una linda caminata de un día
    desde La Paz o un trekking de dos o tres días acampando. Paisajes de alta montaña
    garantizados y muy poca gente.
  todo:
    - Laguna Tuni y Laguna Chiar Khota
    - Trekking de 2 a 3 días alrededor del Condoriri
  tips: Se recomienda guía. Noches muy frías.
