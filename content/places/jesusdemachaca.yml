fr:
  name: Jesús de Machaca
  label: Jesús de Machaca
  short: Village aymara de l'Altiplano et son église de 1706, au sud du lac Titicaca.
  story: >-
    Jesús de Machaca est un village aymara de l'Altiplano, organisé en ayllus, les
    communautés traditionnelles. Son église de 1706, avec sa façade sculptée et son grand
    portail, est l'une des belles églises coloniales de la région. Un village où la vie
    andine suit encore le rythme des saisons.
  todo:
    - Église coloniale de 1706
    - Vie des ayllus aymaras
    - Excursion vers les Urus d'Iruito
  tips: Bus depuis El Alto (environ 3 h, par Viacha). Hébergement très simple.
en:
  name: Jesús de Machaca
  label: Jesús de Machaca
  short: An Aymara Altiplano village and its 1706 church, south of Lake Titicaca.
  story: >-
    Jesús de Machaca is an Aymara village on the Altiplano, organised in ayllus, the
    traditional communities. Its 1706 church, with a carved façade and grand doorway, is one
    of the region's fine colonial churches. A village where Andean life still follows the
    seasons.
  todo:
    - Colonial church of 1706
    - Life in the Aymara ayllus
    - Trip to the Urus of Iruito
  tips: Bus from El Alto (about 3 h, via Viacha). Very simple lodging.
es:
  name: Jesús de Machaca
  label: Jesús de Machaca
  short: Pueblo aymara del Altiplano y su templo de 1706, al sur del lago Titicaca.
  story: >-
    Jesús de Machaca es un pueblo aymara del Altiplano, organizado en ayllus, las
    comunidades tradicionales. Su templo de 1706, con fachada tallada y gran portada, es uno
    de los lindos templos coloniales de la región. Un pueblo donde la vida andina sigue el
    ritmo de las estaciones.
  todo:
    - Templo colonial de 1706
    - Vida de los ayllus aymaras
    - Excursión a los urus de Iruito
  tips: Bus desde El Alto (unas 3 h, por Viacha). Alojamiento muy sencillo.
